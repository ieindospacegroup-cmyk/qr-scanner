<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Scanner pp</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 50%, #1a1a1a 100%);
            min-height: 100vh;
            padding: 20px;
            color: #ffffff;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            animation: fadeIn 0.8s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            background: linear-gradient(135deg, #3c3c3c 0%, #4a4a4a 100%);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        .header h1 {
            color: white;
            font-size: 24px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .scanner-section {
            background: linear-gradient(135deg, #3c3c3c 0%, #4a4a4a 100%);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .scanner-status {
            text-align: center;
            padding: 15px;
            margin: 15px 0;
            border-radius: 8px;
            font-weight: bold;
        }

        .scanner-status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .scanner-status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .scanner-status.info {
            background: #4a4a4a;
            color: white;
            border: 1px solid #5a5a5a;
        }

        .scanner-status.warning {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }

        #qr-reader {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        .btn {
            background: linear-gradient(135deg, #ff6b35 0%, #ff8c42 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            margin: 5px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(255, 107, 53, 0.3);
        }

        .btn:hover {
            background: linear-gradient(135deg, #e55a2b 0%, #ff6b35 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 53, 0.4);
        }

        .btn-primary {
            background: linear-gradient(135deg, #4a4a4a 0%, #5a5a5a 100%);
            box-shadow: 0 4px 15px rgba(74, 74, 74, 0.3);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #3a3a3a 0%, #4a4a4a 100%);
        }

        .btn-info {
            background: linear-gradient(135deg, #17a2b8 0%, #20c997 100%);
            box-shadow: 0 4px 15px rgba(23, 162, 184, 0.3);
        }

        .btn-info:hover {
            background: linear-gradient(135deg, #138496 0%, #17a2b8 100%);
        }

        .button-group {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin: 20px 0;
        }

        .result-section {
            background: linear-gradient(135deg, #3c3c3c 0%, #4a4a4a 100%);
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            display: none;
        }

        .result-content {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            word-break: break-all;
            margin-bottom: 15px;
        }

        .manual-input {
            width: 100%;
            padding: 15px;
            border: 2px solid #4a4a4a;
            border-radius: 8px;
            background: #2a2a2a;
            color: white;
            font-family: 'Courier New', monospace;
            resize: vertical;
            margin-bottom: 10px;
        }

        .manual-input:focus {
            outline: none;
            border-color: #ff6b35;
            box-shadow: 0 0 10px rgba(255, 107, 53, 0.3);
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            
            #qr-reader {
                max-width: 100%;
            }
            
            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📷 QR Scanner </h1>
            <div id="scannerStatus" class="scanner-status info">Memulai scanner...</div>
        </div>

        <div class="scanner-section">
            <div id="qr-reader"></div>
            
            <div class="button-group">
                <button class="btn btn-primary" onclick="startCameraScan()">📸 Start Camera</button>
                <button class="btn" onclick="stopCameraScan()">⏹️ Stop Camera</button>
                <button class="btn btn-info" onclick="switchCamera()">🔄 Switch Camera</button>
                <button class="btn btn-warning" onclick="requestCameraPermission()">🔁 Request Camera Permission</button>
            </div>
        </div>

        <div class="scanner-section">
            <h3>📝 Manual Input</h3>
            <textarea id="manualInput" 
                      placeholder="Format: JO Number|Product Code|Product Name|QTY Order|Serial Number"
                      rows="3"
                      class="manual-input"></textarea>
            <div class="button-group">
                <button class="btn btn-primary" onclick="processManualInput()">📷 Process QR</button>
                <button class="btn" onclick="clearManualInput()">🗑️ Clear</button>
            </div>
        </div>

        <div id="resultSection" class="result-section">
            <h3>📊 Scan Result</h3>
            <div id="resultContent" class="result-content"></div>
            <div class="button-group">
                <button class="btn btn-primary" onclick="sendToAppsScript()">📤 Send to Dashboard</button>
                <button class="btn btn-info" onclick="copyResult()">📋 Copy Result</button>
                <button class="btn" onclick="resetScanner()">🔄 Scan Again</button>
            </div>
        </div>
    </div>

    <script>
        // Global variables
        let html5QrCode = null;
        let lastScanResult = null;
        let cameras = [];
        let currentCameraId = null;

        // Get URL parameters
        function getUrlParameter(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        // Update scanner status
        function updateScannerStatus(message, type = 'info') {
            const statusDiv = document.getElementById('scannerStatus');
            statusDiv.textContent = message;
            statusDiv.className = 'scanner-status ' + type;
        }

        // Start camera scanner
        function startCameraScan() {
            console.log('=== STARTING CAMERA SCANNER ===');
            updateScannerStatus('📸 Memulai scanner kamera...', 'info');
            
            // Check if camera is supported
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                updateScannerStatus('❌ Browser tidak mendukung kamera. Gunakan Manual Input.', 'error');
                return;
            }

            // Initialize HTML5 QR Code
            try {
                if (!html5QrCode) {
                    html5QrCode = new Html5Qrcode("qr-reader");
                    console.log('HTML5 QR Code initialized');
                }

                // Get available cameras
                Html5Qrcode.getCameras().then(devices => {
                    cameras = devices;
                    console.log('Available cameras:', devices);

                    if (devices && devices.length > 0) {
                        // Use first camera or back camera if available
                        const backCamera = devices.find(device => 
                            device.label.toLowerCase().includes('back') || 
                            device.label.toLowerCase().includes('environment')
                        );
                        
                        const selectedCamera = backCamera || devices[0];
                        currentCameraId = selectedCamera.id;
                        
                        console.log('Selected camera:', selectedCamera);
                        
                        // Start scanning
                        html5QrCode.start(
                            selectedCamera.id,
                            {
                                fps: 10,
                                qrbox: { width: 250, height: 250 }
                            },
                            (decodedText, result) => {
                                console.log('QR Code scan successful:', decodedText);
                                onScanSuccess(decodedText);
                            },
                            (errorMessage) => {
                                // Don't show every error, only important ones
                                if (!errorMessage.includes('No QR code found')) {
                                    console.log('QR Scan error:', errorMessage);
                                }
                            }
                        ).then(() => {
                            updateScannerStatus('✅ Scanner aktif. Arahkan kamera ke QR code.', 'success');
                        }).catch((err) => {
                            console.error('Unable to start scanning:', err);
                            updateScannerStatus('❌ Gagal memulai scanner: ' + err.message, 'error');
                        });
                    } else {
                        updateScannerStatus('❌ Tidak ada kamera yang ditemukan.', 'error');
                    }
                }).catch((err) => {
                    console.error('Camera enumeration error:', err);
                    
                    if (err.name === 'NotAllowedError' || err.message.includes('Permission denied')) {
                        updateScannerStatus('❌ Izin kamera ditolak. Silakan izinkan kamera di browser settings.', 'error');
                        
                        // Show instructions for enabling camera
                        setTimeout(() => {
                            updateScannerStatus('💡 Klik ikon 🔒 di address bar dan izinkan kamera, lalu refresh halaman.', 'warning');
                        }, 2000);
                    } else {
                        updateScannerStatus('❌ Gagal mengakses kamera: ' + err.message + '. Gunakan Manual Input.', 'error');
                    }
                    
                    // Focus on manual input as fallback
                    setTimeout(() => {
                        document.getElementById('manualInput').focus();
                        updateScannerStatus('📝 Gunakan Manual Input untuk memasukkan QR data.', 'info');
                    }, 3000);
                });

            } catch (error) {
                console.error('HTML5 QR Code initialization error:', error);
                updateScannerStatus('❌ Library scanner error. Gunakan input manual.', 'error');
            }
        }

        // Stop camera scanner
        function stopCameraScan() {
            console.log('=== STOPPING CAMERA SCANNER ===');
            
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    console.log('Scanner stopped successfully');
                    updateScannerStatus('⏹️ Scanner dihentikan.', 'info');
                }).catch((err) => {
                    console.error('Failed to stop scanning:', err);
                    updateScannerStatus('❌ Gagal menghentikan scanner.', 'error');
                });
            } else {
                updateScannerStatus('⏹️ Scanner tidak aktif.', 'info');
            }
        }

        // Switch camera
        function switchCamera() {
            if (!html5QrCode || cameras.length <= 1) {
                updateScannerStatus('❌ Hanya ada satu kamera tersedia.', 'warning');
                return;
            }

            // Find current camera index
            const currentIndex = cameras.findIndex(cam => cam.id === currentCameraId);
            
            // Try to find opposite camera type
            let nextCamera;
            const isBackCamera = cameras[currentIndex].label.toLowerCase().includes('back') || 
                                cameras[currentIndex].label.toLowerCase().includes('environment') ||
                                cameras[currentIndex].label.toLowerCase().includes('rear');
            
            if (isBackCamera) {
                // Switch to front camera
                nextCamera = cameras.find(device => 
                    device.label.toLowerCase().includes('front') || 
                    device.label.toLowerCase().includes('user')
                );
            } else {
                // Switch to back camera
                nextCamera = cameras.find(device => 
                    device.label.toLowerCase().includes('back') || 
                    device.label.toLowerCase().includes('environment') ||
                    device.label.toLowerCase().includes('rear')
                );
            }

            // If opposite camera not found, use next camera
            if (!nextCamera) {
                const nextIndex = (currentIndex + 1) % cameras.length;
                nextCamera = cameras[nextIndex];
            }

            // Stop current scanner and start with new camera
            if (html5QrCode && nextCamera) {
                html5QrCode.stop().then(() => {
                    currentCameraId = nextCamera.id;
                    console.log('Switching to camera:', nextCamera);
                    
                    // Restart with new camera
                    setTimeout(() => {
                        startCameraScan();
                    }, 500);
                }).catch((err) => {
                    console.error('Failed to stop for camera switch:', err);
                    updateScannerStatus('❌ Gagal mengganti kamera.', 'error');
                });
            }
        }

        // Parse QR Code data according to format: JO Number|Product Code|Product Name|QTY Order|Serial Number
        function parseQRData(qrText) {
            console.log('=== PARSING QR DATA ===');
            console.log('Raw QR Text:', qrText);
            
            // Clean and split by delimiter '|'
            const cleanedText = qrText.trim();
            const fields = cleanedText.split('|');
            
            console.log('Split fields:', fields);
            console.log('Number of fields:', fields.length);
            
            // Expected format: 5 fields
            const expectedFields = 5;
            const isValid = fields.length === expectedFields;
            
            if (!isValid) {
                console.warn('⚠️ INVALID FORMAT - Expected:', expectedFields, 'fields, Got:', fields.length);
                console.warn('Field contents:', fields);
            } else {
                console.log('✅ VALID FORMAT - All 5 fields detected');
            }
            
            const parsedData = {
                joNumber: fields[0] ? fields[0].trim() : '',
                productCode: fields[1] ? fields[1].trim() : '',
                productName: fields[2] ? fields[2].trim() : '',
                qtyOrder: fields[3] ? fields[3].trim() : '',
                serialNumber: fields[4] ? fields[4].trim() : '',
                rawData: cleanedText,
                fieldCount: fields.length,
                isValid: isValid
            };
            
            console.log('📋 PARSED RESULT:');
            console.log('  JO Number:', parsedData.joNumber);
            console.log('  Product Code:', parsedData.productCode);
            console.log('  Product Name:', parsedData.productName);
            console.log('  QTY Order:', parsedData.qtyOrder);
            console.log('  Serial Number:', parsedData.serialNumber);
            console.log('  Valid Format:', parsedData.isValid);
            
            return parsedData;
        }

        // Store last scanned JO numbers for validation
        let lastScannedJOs = new Map(); // Map to store JO Number -> Product Code

        // Validate if JO Number already scanned with different Product Code
        function validateJOAndProductCode(parsedData) {
            const joNumber = parsedData.joNumber;
            const productCode = parsedData.productCode;
            
            if (!joNumber || !productCode) {
                return {
                    isValid: true,
                    warning: null,
                    message: null
                };
            }
            
            // Check if this JO Number was scanned before
            if (lastScannedJOs.has(joNumber)) {
                const lastProductCode = lastScannedJOs.get(joNumber);
                
                if (lastProductCode !== productCode) {
                    // Same JO Number but different Product Code - ALLOW but show warning
                    return {
                        isValid: true, // ALLOW the scan but show warning
                        warning: 'DUPLICATE_JO_DIFFERENT_PRODUCT',
                        message: `⚠️ Perhatian: JO Number "${joNumber}" sebelumnya discan dengan Product Code "${lastProductCode}". Sekarang dengan Product Code "${productCode}". Pastikan ini benar!`
                    };
                } else {
                    // Same JO Number and same Product Code
                    return {
                        isValid: true,
                        warning: 'DUPLICATE_JO_SAME_PRODUCT',
                        message: `ℹ️ Info: JO Number "${joNumber}" dengan Product Code "${productCode}" sudah discan sebelumnya.`
                    };
                }
            } else {
                // First time scanning this JO Number
                return {
                    isValid: true,
                    warning: null,
                    message: null
                };
            }
        }

        // Add JO Number to tracking
        function addJOScan(joNumber, productCode) {
            if (joNumber && productCode) {
                lastScannedJOs.set(joNumber, productCode);
                console.log(`Added JO tracking: ${joNumber} -> ${productCode}`);
                console.log('Current JO tracking:', Array.from(lastScannedJOs.entries()));
            }
        }

        // Clear JO tracking
        function clearJOScanTracking() {
            lastScannedJOs.clear();
            console.log('JO scan tracking cleared');
        }

        // Handle successful scan
        function onScanSuccess(decodedText) {
            console.log('=== NEW SCAN DETECTED ===');
            console.log('Scan successful:', decodedText);
            lastScanResult = decodedText;
            
            // Parse QR data
            const parsedData = parseQRData(decodedText);
            
            // Validate JO Number and Product Code
            const validation = validateJOAndProductCode(parsedData);
            
            // Stop scanner
            stopCameraScan();
            
            // ALWAYS display the new scan result first
            console.log('🔄 UPDATING DISPLAY WITH NEW DATA...');
            displayScanResult(parsedData, validation);
            
            // Always add to JO tracking (update if exists)
            addJOScan(parsedData.joNumber, parsedData.productCode);
            
            if (validation.warning === 'DUPLICATE_JO_DIFFERENT_PRODUCT') {
                updateScannerStatus('⚠️ JO Number sama dengan Product Code berbeda. Data ditampilkan, silakan verifikasi.', 'warning');
            } else if (validation.warning === 'DUPLICATE_JO_SAME_PRODUCT') {
                updateScannerStatus('ℹ️ Data duplikat dengan JO dan Product Code sama.', 'info');
            } else {
                updateScannerStatus('✅ Scan berhasil! Data diparsing...', 'success');
            }
            
            // Auto-send to dashboard after 1 second
            setTimeout(() => {
                sendToAppsScript();
            }, 1000);
        }

        // Display scan result in formatted way
        function displayScanResult(parsedData, validation = null) {
            const resultContent = document.getElementById('resultContent');
            
            let html = '<div style="margin-bottom: 15px;">';
            html += '<h4 style="color: #ff6b35; margin-bottom: 15px;">📋 QR Scan Result - All Fields:</h4>';
            
            // Show validation message if available
            if (validation && validation.message) {
                const alertClass = validation.warning === 'DUPLICATE_JO_DIFFERENT_PRODUCT' ? 'warning' : 'info';
                html += `<div class="scanner-status ${alertClass}" style="margin-bottom: 15px;">${validation.message}</div>`;
            }
            
            if (parsedData.isValid) {
                // Display each field with clear separation
                html += `<div style="background: rgba(255,255,255,0.05); padding: 15px; border-radius: 8px; margin-bottom: 10px;">`;
                html += `<div style="display: grid; gap: 12px;">`;
                
                // JO Number
                html += `<div style="display: flex; align-items: center; padding: 8px; background: rgba(74, 74, 74, 0.3); border-radius: 5px;">`;
                html += `<div style="font-weight: bold; color: #ff6b35; min-width: 120px;">JO Number:</div>`;
                html += `<div style="color: #ffffff; font-family: monospace; font-size: 14px;">${parsedData.joNumber || 'N/A'}</div>`;
                html += `</div>`;
                
                // Product Code
                html += `<div style="display: flex; align-items: center; padding: 8px; background: rgba(74, 74, 74, 0.3); border-radius: 5px;">`;
                html += `<div style="font-weight: bold; color: #ff6b35; min-width: 120px;">Product Code:</div>`;
                html += `<div style="color: #ffffff; font-family: monospace; font-size: 14px;">${parsedData.productCode || 'N/A'}</div>`;
                html += `</div>`;
                
                // Product Name
                html += `<div style="display: flex; align-items: center; padding: 8px; background: rgba(74, 74, 74, 0.3); border-radius: 5px;">`;
                html += `<div style="font-weight: bold; color: #ff6b35; min-width: 120px;">Product Name:</div>`;
                html += `<div style="color: #ffffff; font-size: 14px;">${parsedData.productName || 'N/A'}</div>`;
                html += `</div>`;
                
                // QTY Order
                html += `<div style="display: flex; align-items: center; padding: 8px; background: rgba(74, 74, 74, 0.3); border-radius: 5px;">`;
                html += `<div style="font-weight: bold; color: #ff6b35; min-width: 120px;">QTY Order:</div>`;
                html += `<div style="color: #ffffff; font-family: monospace; font-size: 14px;">${parsedData.qtyOrder || 'N/A'}</div>`;
                html += `</div>`;
                
                // Serial Number
                html += `<div style="display: flex; align-items: center; padding: 8px; background: rgba(74, 74, 74, 0.3); border-radius: 5px;">`;
                html += `<div style="font-weight: bold; color: #ff6b35; min-width: 120px;">Serial Number:</div>`;
                html += `<div style="color: #ffffff; font-family: monospace; font-size: 14px;">${parsedData.serialNumber || 'N/A'}</div>`;
                html += `</div>`;
                
                html += `</div>`;
                html += `</div>`;
                
                // Success indicator
                html += `<div style="margin-top: 10px; padding: 10px; background: rgba(76, 175, 80, 0.2); border-radius: 5px;">`;
                html += `<small style="color: #4CAF50;">✅ Semua 5 field berhasil dibaca dengan benar</small>`;
                html += `</div>`;
                
                // Show JO tracking info
                if (lastScannedJOs.size > 0) {
                    html += `<div style="margin-top: 15px; padding: 10px; background: rgba(33, 150, 243, 0.1); border-radius: 5px;">`;
                    html += `<div style="font-size: 12px; color: #1976D2;"><strong>📋 JO Tracking (${lastScannedJOs.size} items):</strong></div>`;
                    for (const [jo, product] of lastScannedJOs.entries()) {
                        html += `<div style="font-size: 11px; margin-left: 10px;">• ${jo} → ${product}</div>`;
                    }
                    html += `</div>`;
                }
            } else {
                html += `<div style="color: #ff9800; padding: 15px; background: rgba(255, 152, 0, 0.1); border-radius: 5px;">`;
                html += `<div><strong>⚠️ Format tidak sesuai (expected: 5 fields, got: ${parsedData.fieldCount})</strong></div>`;
                html += `<div style="margin-top: 10px; font-family: monospace; font-size: 12px;">`;
                for (let i = 0; i < parsedData.fieldCount; i++) {
                    html += `<div>Field ${i+1}: "${parsedData.rawData.split('|')[i]}"</div>`;
                }
                html += `</div>`;
                html += `</div>`;
            }
            
            // Raw data display
            html += `<div style="margin-top: 15px; padding: 10px; background: rgba(255,255,255,0.1); border-radius: 5px;">`;
            html += `<div style="font-size: 12px; color: #ccc; margin-bottom: 5px;"><strong>Raw Data:</strong></div>`;
            html += `<div style="font-family: monospace; word-break: break-all; font-size: 11px; color: #ffffff;">${parsedData.rawData}</div>`;
            html += `</div>`;
            html += '</div>';
            
            resultContent.innerHTML = html;
            document.getElementById('resultSection').style.display = 'block';
        }

        // Process manual input
        function processManualInput() {
            const manualValue = document.getElementById('manualInput').value.trim();
            if (manualValue) {
                onScanSuccess(manualValue);
                document.getElementById('manualInput').value = '';
            } else {
                updateScannerStatus('⚠️ Masukkan QR/Barcode terlebih dahulu', 'warning');
            }
        }

        // Clear manual input
        function clearManualInput() {
            document.getElementById('manualInput').value = '';
        }

        // Copy result to clipboard
        function copyResult() {
            if (lastScanResult) {
                const parsedData = parseQRData(lastScanResult);
                let textToCopy = '';
                
                if (parsedData.isValid) {
                    textToCopy = `JO Number: ${parsedData.joNumber}\n` +
                                `Product Code: ${parsedData.productCode}\n` +
                                `Product Name: ${parsedData.productName}\n` +
                                `QTY Order: ${parsedData.qtyOrder}\n` +
                                `Serial Number: ${parsedData.serialNumber}\n\n` +
                                `Raw: ${parsedData.rawData}`;
                } else {
                    textToCopy = `Raw QR Data: ${parsedData.rawData}\n` +
                                `Fields: ${parsedData.fieldCount} (expected: 5)`;
                }
                
                navigator.clipboard.writeText(textToCopy).then(() => {
                    updateScannerStatus('📋 Hasil formatted disalin ke clipboard!', 'success');
                }).catch(err => {
                    updateScannerStatus('❌ Gagal menyalin hasil', 'error');
                });
            } else {
                updateScannerStatus('⚠️ Tidak ada hasil untuk disalin', 'warning');
            }
        }

        // Send result back to Dashboard via postMessage or Apps Script GET
        function sendToAppsScript() {
            console.log('=== sendToAppsScript called ===');
            console.log('lastScanResult:', lastScanResult);
            
            if (!lastScanResult) {
                updateScannerStatus('⚠️ Tidak ada hasil untuk dikirim', 'warning');
                return;
            }
            
            const processId = getUrlParameter('processId') || 'ext_' + Date.now();
            const mode = getUrlParameter('mode') || 'redirect';
            console.log('Process ID:', processId);
            console.log('Mode:', mode);
            
            // Get returnUrl from URL parameters - DEBUGGING
            const returnUrl = getUrlParameter('returnUrl') || getUrlParameter('return') || 'https://script.google.com/macros/s/AKfycbwHLp6CFcNNSybJle982xGpCV5oXw6nvmd3R8W7Q1o/exec';
            console.log('Return URL:', returnUrl);
            console.log('Return URL type:', typeof returnUrl);
            console.log('Return URL length:', returnUrl ? returnUrl.length : 'null');
            
            // Try postMessage first (if opener is available)
            try {
                console.log('Checking window.opener:', window.opener);
                console.log('window.opener.closed:', window.opener ? window.opener.closed : 'N/A');
                
                if (window.opener && !window.opener.closed) {
                    const messageData = {
                        type: 'QR_SCAN_RESULT',
                        qrResult: lastScanResult,
                        processId: processId,
                        timestamp: new Date().toISOString(),
                        source: 'external_scanner'
                    };
                    
                    console.log('📤 SENDING POSTMESSAGE:', messageData);
                    window.opener.postMessage(messageData, '*');
                    
                    console.log('✅ Sent result via postMessage');
                    updateScannerStatus('✅ Hasil dikirim ke Dashboard via postMessage', 'success');
                    
                    // Close after a short delay
                    setTimeout(() => {
                        window.close();
                    }, 1500);
                    return;
                } else {
                    console.log('❌ Window opener not available or closed, trying Apps Script GET...');
                }
            } catch (error) {
                console.error('❌ postMessage failed, trying Apps Script GET:', error);
            }
            
            // Fallback: Send to Apps Script via URL redirect (bypass CORS)
            updateScannerStatus('📤 Mengirim ke Apps Script dan kembali ke Dashboard...', 'info');
            
            // Use URL redirect to bypass CORS
            const appsScriptUrl = 'https://script.google.com/macros/s/AKfycbwHLp6CFcNNSybJle982xGpCV5oXw6nvmd3R8W7Q1o/exec';
            
            // Build redirect URL with QR data
            const params = new URLSearchParams({
                qrResult: lastScanResult,
                source: 'external_scanner',
                processId: processId,
                timestamp: new Date().toISOString(),
                returnUrl: returnUrl, // Pass returnUrl for redirect back
                redirectBack: 'true', // Enable redirect back to dashboard
                scanSuccess: 'true' // Indicate successful scan
            });
            
            const redirectUrl = appsScriptUrl + '?' + params.toString();
            console.log('Redirect URL:', redirectUrl);
            
            // Show success message before redirect
            updateScannerStatus('✅ Data diproses. Mengalihkan kembali ke Dashboard...', 'success');
            
            // IMMEDIATE redirect to Apps Script (no delay)
            window.location.href = redirectUrl;
        }

        // Reset scanner
        function resetScanner() {
            console.log('=== RESETTING SCANNER ===');
            
            // Clear results
            document.getElementById('resultContent').innerHTML = '';
            document.getElementById('resultSection').style.display = 'none';
            
            // Clear JO tracking
            clearJOScanTracking();
            
            // Clear last scan result
            lastScanResult = null;
            
            updateScannerStatus('🔄 Scanner direset. Siap untuk scan baru.', 'info');
            
            // Auto-start camera after reset
            setTimeout(() => {
                startCameraScan();
            }, 1000);
        }

        // Request camera permission
        function requestCameraPermission() {
            console.log('=== REQUESTING CAMERA PERMISSION ===');
            updateScannerStatus('🔁 Meminta izin kamera...', 'info');
            
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                navigator.mediaDevices.getUserMedia({ video: true })
                    .then(function(stream) {
                        console.log('Camera permission granted');
                        updateScannerStatus('✅ Izin kamera diberikan. Memulai scanner...', 'success');
                        
                        // Stop the stream immediately
                        stream.getTracks().forEach(track => track.stop());
                        
                        // Start scanner
                        setTimeout(() => {
                            startCameraScan();
                        }, 500);
                    })
                    .catch(function(err) {
                        console.error('Camera permission denied:', err);
                        updateScannerStatus('❌ Izin kamera ditolak. Silakan izinkan kamera di browser settings.', 'error');
                    });
            } else {
                updateScannerStatus('❌ Browser tidak mendukung kamera.', 'error');
            }
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function() {
            console.log('QR Scanner External Page Loaded');
            console.log('Current URL:', window.location.href);
            console.log('URL Parameters:', window.location.search);
            
            // Get URL parameters
            const returnUrl = getUrlParameter('returnUrl') || getUrlParameter('return');
            const title = getUrlParameter('title') || 'QR Scanner';
            const processId = getUrlParameter('processId') || 'process_' + Date.now();
            
            console.log('Return URL:', returnUrl);
            console.log('Title:', title);
            console.log('Process ID:', processId);
            
            // Update page title
            if (title) {
                document.title = title;
            }
            
            // Always show success message since we have parameters
            if (returnUrl) {
                updateScannerStatus('✅ Scanner siap. Hasil akan dikirim ke Dashboard.', 'success');
            } else {
                updateScannerStatus('⚠️ Scanner siap. Mode standalone (no return URL).', 'info');
            }
            
            // Auto-focus manual input
            document.getElementById('manualInput').focus();
            
            // Auto-start camera scanner
            setTimeout(() => {
                startCameraScan();
            }, 1000);
        });
    </script>
</body>
</html>
