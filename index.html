<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Scanner - FULFILMENT AQUATEAK 2026</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 50%, #1a1a1a 100%);
            min-height: 100vh;
            padding: 20px;
            color: #ffffff;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            animation: fadeIn 0.8s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            background: linear-gradient(135deg, #3c3c3c 0%, #4a4a4a 100%);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        .header h1 {
            color: white;
            font-size: 24px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .scanner-section {
            background: linear-gradient(135deg, #3c3c3c 0%, #4a4a4a 100%);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .scanner-status {
            text-align: center;
            padding: 15px;
            margin: 15px 0;
            border-radius: 8px;
            font-weight: bold;
        }

        .scanner-status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .scanner-status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .scanner-status.info {
            background: #4a4a4a;
            color: white;
            border: 1px solid #5a5a5a;
        }

        .scanner-status.warning {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }

        #qr-reader {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        .btn {
            background: linear-gradient(135deg, #ff6b35 0%, #ff8c42 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            margin: 5px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(255, 107, 53, 0.3);
        }

        .btn:hover {
            background: linear-gradient(135deg, #e55a2b 0%, #ff6b35 100%);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 53, 0.4);
        }

        .btn-primary {
            background: linear-gradient(135deg, #4a4a4a 0%, #5a5a5a 100%);
            box-shadow: 0 4px 15px rgba(74, 74, 74, 0.3);
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #3a3a3a 0%, #4a4a4a 100%);
        }

        .btn-info {
            background: linear-gradient(135deg, #17a2b8 0%, #20c997 100%);
            box-shadow: 0 4px 15px rgba(23, 162, 184, 0.3);
        }

        .btn-info:hover {
            background: linear-gradient(135deg, #138496 0%, #17a2b8 100%);
        }

        .button-group {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin: 20px 0;
        }

        .result-section {
            background: linear-gradient(135deg, #3c3c3c 0%, #4a4a4a 100%);
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            display: none;
        }

        .result-content {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            word-break: break-all;
            margin-bottom: 15px;
        }

        .manual-input {
            width: 100%;
            padding: 15px;
            border: 2px solid #4a4a4a;
            border-radius: 8px;
            background: #2a2a2a;
            color: white;
            font-family: 'Courier New', monospace;
            resize: vertical;
            margin-bottom: 10px;
        }

        .manual-input:focus {
            outline: none;
            border-color: #ff6b35;
            box-shadow: 0 0 10px rgba(255, 107, 53, 0.3);
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            
            #qr-reader {
                max-width: 100%;
            }
            
            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📷 QR Scanner - FULFILMENT AQUATEAK 2026</h1>
            <div id="scannerStatus" class="scanner-status info">Memulai scanner...</div>
        </div>

        <div class="scanner-section">
            <div id="qr-reader"></div>
            
            <div class="button-group">
                <button class="btn btn-primary" onclick="startCameraScan()">📸 Start Camera</button>
                <button class="btn" onclick="stopCameraScan()">⏹️ Stop Camera</button>
                <button class="btn btn-info" onclick="switchCamera()">🔄 Switch Camera</button>
                <button class="btn btn-warning" onclick="requestCameraPermission()">🔁 Request Camera Permission</button>
            </div>
        </div>

        <div class="scanner-section">
            <h3>📝 Manual Input</h3>
            <textarea id="manualInput" 
                      placeholder="Format: JO Number|Product Code|Product Name|QTY Order|Serial Number"
                      rows="3"
                      class="manual-input"></textarea>
            <div class="button-group">
                <button class="btn btn-primary" onclick="processManualInput()">📷 Process QR</button>
                <button class="btn" onclick="clearManualInput()">🗑️ Clear</button>
            </div>
        </div>

        <div id="resultSection" class="result-section">
            <h3>📊 Scan Result</h3>
            <div id="resultContent" class="result-content"></div>
            <div class="button-group">
                <button class="btn btn-primary" onclick="sendToAppsScript()">📤 Send to Dashboard</button>
                <button class="btn btn-info" onclick="copyResult()">📋 Copy Result</button>
                <button class="btn" onclick="resetScanner()">🔄 Scan Again</button>
            </div>
        </div>
    </div>

    <script>
        // Global variables
        let html5QrCode = null;
        let lastScanResult = null;
        let cameras = [];
        let currentCameraId = null;
        let allScannedItems = [];
        let lastScannedJOs = new Map();

        // Get URL parameters
        function getUrlParameter(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        // Update scanner status
        function updateScannerStatus(message, type = 'info') {
            const statusDiv = document.getElementById('scannerStatus');
            statusDiv.textContent = message;
            statusDiv.className = 'scanner-status ' + type;
        }

        // Parse QR data into structured format
        function parseQRData(qrText) {
            console.log('=== PARSING QR DATA ===');
            console.log('Raw QR Text:', qrText);
            
            // Clean and split by delimiter '|'
            const cleanedText = qrText.trim();
            const fields = cleanedText.split('|');
            
            console.log('Split fields:', fields);
            console.log('Number of fields:', fields.length);
            
            // Expected format: 5 fields
            const expectedFields = 5;
            const isValid = fields.length === expectedFields;
            
            if (!isValid) {
                console.warn('⚠️ INVALID FORMAT - Expected:', expectedFields, 'fields, Got:', fields.length);
                console.warn('Field contents:', fields);
            } else {
                console.log('✅ VALID FORMAT - All 5 fields detected');
            }
            
            const parsedData = {
                joNumber: fields[0] ? fields[0].trim() : '',
                productCode: fields[1] ? fields[1].trim() : '',
                productName: fields[2] ? fields[2].trim() : '',
                qtyOrder: fields[3] ? fields[3].trim() : '',
                serialNumber: fields[4] ? fields[4].trim() : '',
                rawData: cleanedText,
                fieldCount: fields.length,
                isValid: isValid
            };
            
            console.log('📋 PARSED RESULT:');
            console.log('  JO Number:', parsedData.joNumber);
            console.log('  Product Code:', parsedData.productCode);
            console.log('  Product Name:', parsedData.productName);
            console.log('  QTY Order:', parsedData.qtyOrder);
            console.log('  Serial Number:', parsedData.serialNumber);
            console.log('  Valid Format:', parsedData.isValid);
            
            return parsedData;
        }

        // Validate JO Number and Product Code (ALLOW ALL SCANS)
        function validateJOAndProductCode(parsedData) {
            console.log('=== VALIDATING JO AND PRODUCT CODE ===');
            const joNumber = parsedData.joNumber;
            const productCode = parsedData.productCode;
            
            console.log('JO Number:', joNumber);
            console.log('Product Code:', productCode);
            console.log('Current JO tracking before validation:', Array.from(lastScannedJOs.entries()));
            
            if (!joNumber || !productCode) {
                console.log('❌ Missing JO or Product Code');
                return {
                    isValid: true,
                    warning: null,
                    message: null
                };
            }
            
            // Check if this JO Number was scanned before
            if (lastScannedJOs.has(joNumber)) {
                const lastProductCode = lastScannedJOs.get(joNumber);
                console.log('JO Number found in tracking. Last Product Code:', lastProductCode);
                
                if (lastProductCode !== productCode) {
                    // Same JO Number but different Product Code - ALLOW with info
                    console.log('✅ Different Product Code with same JO - ALLOWING');
                    return {
                        isValid: true,
                        warning: 'DIFFERENT_PRODUCT_SAME_JO',
                        message: `ℹ️ JO Number "${joNumber}" sebelumnya dengan Product Code "${lastProductCode}". Sekarang dengan Product Code "${productCode}".`
                    };
                } else {
                    // Same JO Number and same Product Code
                    console.log('✅ Same Product Code with same JO - ALLOWING');
                    return {
                        isValid: true,
                        warning: 'SAME_PRODUCT_SAME_JO',
                        message: `ℹ️ JO Number "${joNumber}" dengan Product Code "${productCode}" - Scan ke-${allScannedItems.filter(item => item.joNumber === joNumber && item.productCode === productCode).length + 1}`
                    };
                }
            } else {
                // First time scanning this JO Number
                console.log('✅ First time scanning this JO Number');
                return {
                    isValid: true,
                    warning: null,
                    message: null
                };
            }
        }

        // Add JO scan to tracking
        function addJOScan(joNumber, productCode) {
            console.log('=== ADDING JO SCAN TO TRACKING ===');
            console.log('JO Number:', joNumber);
            console.log('Product Code:', productCode);
            console.log('JO tracking before:', Array.from(lastScannedJOs.entries()));
            
            if (joNumber && productCode) {
                lastScannedJOs.set(joNumber, productCode);
                console.log('JO tracking after:', Array.from(lastScannedJOs.entries()));
            } else {
                console.log('❌ Missing JO or Product Code - not adding to tracking');
            }
        }

        // Clear JO scan tracking
        function clearJOScanTracking() {
            lastScannedJOs.clear();
            console.log('JO tracking cleared');
        }

        // Clear all scanned items
        function clearAllScannedItems() {
            allScannedItems = [];
            console.log('All scanned items cleared');
        }

        // Display all scanned items with multi-scan support
        function displayAllScannedItems(validation) {
            console.log('=== DISPLAYING ALL SCANNED ITEMS ===');
            console.log('Items to display:', allScannedItems);
            console.log('Validation:', validation);
            
            const resultContent = document.getElementById('resultContent');
            const resultSection = document.getElementById('resultSection');
            
            // Force clear and rebuild display
            resultContent.innerHTML = '';
            resultSection.style.display = 'block';
            
            if (allScannedItems.length === 0) {
                resultContent.innerHTML = '<p style="color: #888;">Tidak ada data yang discan.</p>';
                return;
            }
            
            let html = `<div style="margin-bottom: 15px;">
                <h4 style="color: #4CAF50; margin: 0 0 10px 0;">📊 ALL SCANNED ITEMS (${allScannedItems.length} items)</h4>
            </div>`;
            
            allScannedItems.forEach((item, index) => {
                const isLatest = index === allScannedItems.length - 1;
                const borderStyle = isLatest ? '2px solid #4CAF50' : '1px solid #555';
                const bgColor = isLatest ? 'rgba(76, 175, 80, 0.1)' : 'rgba(255, 255, 255, 0.05)';
                const textColor = isLatest ? '#4CAF50' : '#fff';
                
                // Count duplicates for this JO/Product combination
                const duplicateCount = allScannedItems.filter(i => 
                    i.joNumber === item.joNumber && i.productCode === item.productCode
                ).length;
                const isDuplicate = duplicateCount > 1;
                
                html += `<div style="border: ${borderStyle}; background: ${bgColor}; padding: 15px; margin-bottom: 10px; border-radius: 8px;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                        <h5 style="margin: 0; color: ${textColor}; font-weight: bold;">
                            Item #${item.scanIndex} ${isLatest ? '(NEW)' : ''} ${isDuplicate ? `(Dup: ${duplicateCount})` : ''}
                        </h5>
                        <span style="color: #888; font-size: 12px;">${item.scanTime}</span>
                    </div>`;
                
                if (item.isValid) {
                    html += `<div style="font-size: 14px; line-height: 1.4;">
                        <div><strong>JO Number:</strong> ${item.joNumber}</div>
                        <div><strong>Product Code:</strong> ${item.productCode}</div>
                        <div><strong>Product Name:</strong> ${item.productName}</div>
                        <div><strong>QTY Order:</strong> ${item.qtyOrder}</div>
                        <div><strong>Serial Number:</strong> ${item.serialNumber}</div>
                    </div>`;
                } else {
                    html += `<div style="color: #ff9800; font-size: 14px;">
                        <div><strong>⚠️ Invalid Format:</strong> ${item.fieldCount} fields (expected 5)</div>
                        <div><strong>Raw Data:</strong> ${item.rawData}</div>
                    </div>`;
                }
                
                html += `</div>`;
            });
            
            // Add summary
            const uniqueJOs = new Set(allScannedItems.filter(item => item.isValid).map(item => item.joNumber));
            const uniqueProducts = new Set(allScannedItems.filter(item => item.isValid).map(item => `${item.joNumber}|${item.productCode}`));
            
            html += `<div style="background: rgba(33, 150, 243, 0.1); padding: 15px; border-radius: 8px; margin-top: 15px;">
                <h5 style="color: #2196F3; margin: 0 0 10px 0;">📈 SCAN SUMMARY</h5>
                <div style="font-size: 14px;">
                    <div><strong>Total Scans:</strong> ${allScannedItems.length}</div>
                    <div><strong>Valid Scans:</strong> ${allScannedItems.filter(item => item.isValid).length}</div>
                    <div><strong>Unique JO Numbers:</strong> ${uniqueJOs.size}</div>
                    <div><strong>Unique Products:</strong> ${uniqueProducts.size}</div>
                    <div><strong>JO Tracking:</strong> ${Array.from(lastScannedJOs.entries()).length} tracked</div>
                </div>
            </div>`;
            
            // Add validation info if exists
            if (validation && validation.message) {
                html += `<div style="background: rgba(255, 152, 0, 0.1); padding: 15px; border-radius: 8px; margin-top: 15px;">
                    <div style="color: #ff9800; font-size: 14px;">${validation.message}</div>
                </div>`;
            }
            
            resultContent.innerHTML = html;
            console.log('Display updated with', allScannedItems.length, 'items');
        }

        // Start camera scanner
        function startCameraScan() {
            console.log('=== STARTING CAMERA SCANNER ===');
            updateScannerStatus('📸 Memulai scanner kamera...', 'info');
            
            // Check if camera is supported
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                updateScannerStatus('❌ Browser tidak mendukung kamera. Gunakan Manual Input.', 'error');
                return;
            }

            // Initialize HTML5 QR Code
            try {
                if (!html5QrCode) {
                    html5QrCode = new Html5Qrcode("qr-reader");
                    console.log('HTML5 QR Code initialized');
                }

                // Get available cameras
                Html5Qrcode.getCameras().then(devices => {
                    cameras = devices;
                    console.log('Available cameras:', devices);

                    if (devices && devices.length > 0) {
                        // Use first camera or back camera if available
                        const backCamera = devices.find(device => 
                            device.label.toLowerCase().includes('back') || 
                            device.label.toLowerCase().includes('environment')
                        );
                        
                        const selectedCamera = backCamera || devices[0];
                        currentCameraId = selectedCamera.id;
                        
                        console.log('Selected camera:', selectedCamera);
                        
                        // Start scanning
                        html5QrCode.start(
                            selectedCamera.id,
                            {
                                fps: 10,
                                qrbox: { width: 250, height: 250 }
                            },
                            (decodedText, result) => {
                                console.log('QR Code scan successful:', decodedText);
                                onScanSuccess(decodedText);
                            },
                            (errorMessage) => {
                                // Don't show every error, only important ones
                                if (!errorMessage.includes('No QR code found')) {
                                    console.log('QR Scan error:', errorMessage);
                                }
                            }
                        ).then(() => {
                            updateScannerStatus('✅ Scanner aktif. Arahkan kamera ke QR code.', 'success');
                        }).catch((err) => {
                            console.error('Unable to start scanning:', err);
                            updateScannerStatus('❌ Gagal memulai scanner: ' + err.message, 'error');
                        });
                    } else {
                        updateScannerStatus('❌ Tidak ada kamera yang ditemukan.', 'error');
                    }
                }).catch((err) => {
                    console.error('Camera enumeration error:', err);
                    
                    if (err.name === 'NotAllowedError' || err.message.includes('Permission denied')) {
                        updateScannerStatus('❌ Izin kamera ditolak. Silakan izinkan kamera di browser settings.', 'error');
                        
                        // Show instructions for enabling camera
                        setTimeout(() => {
                            updateScannerStatus('💡 Klik ikon 🔒 di address bar dan izinkan kamera, lalu refresh halaman.', 'warning');
                        }, 2000);
                    } else {
                        updateScannerStatus('❌ Gagal mengakses kamera: ' + err.message + '. Gunakan Manual Input.', 'error');
                    }
                    
                    // Focus on manual input as fallback
                    setTimeout(() => {
                        document.getElementById('manualInput').focus();
                        updateScannerStatus('📝 Gunakan Manual Input untuk memasukkan QR data.', 'info');
                    }, 3000);
                });

            } catch (error) {
                console.error('HTML5 QR Code initialization error:', error);
                updateScannerStatus('❌ Library scanner error. Gunakan input manual.', 'error');
            }
        }

        // Stop camera scanner
        function stopCameraScan() {
            console.log('=== STOPPING CAMERA SCANNER ===');
            
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    console.log('Scanner stopped successfully');
                    updateScannerStatus('⏹️ Scanner dihentikan.', 'info');
                }).catch((err) => {
                    console.error('Failed to stop scanning:', err);
                    updateScannerStatus('❌ Gagal menghentikan scanner.', 'error');
                });
            } else {
                updateScannerStatus('⏹️ Scanner tidak aktif.', 'info');
            }
        }

        // Switch camera
        function switchCamera() {
            if (!html5QrCode || cameras.length <= 1) {
                updateScannerStatus('❌ Hanya ada satu kamera tersedia.', 'warning');
                return;
            }

            // Find current camera index
            const currentIndex = cameras.findIndex(cam => cam.id === currentCameraId);
            
            // Try to find opposite camera type
            let nextCamera;
            const isBackCamera = cameras[currentIndex].label.toLowerCase().includes('back') || 
                                cameras[currentIndex].label.toLowerCase().includes('environment') ||
                                cameras[currentIndex].label.toLowerCase().includes('rear');
            
            if (isBackCamera) {
                // Switch to front camera
                nextCamera = cameras.find(device => 
                    device.label.toLowerCase().includes('front') || 
                    device.label.toLowerCase().includes('user')
                );
            } else {
                // Switch to back camera
                nextCamera = cameras.find(device => 
                    device.label.toLowerCase().includes('back') || 
                    device.label.toLowerCase().includes('environment') ||
                    device.label.toLowerCase().includes('rear')
                );
            }

            // If opposite camera not found, use next camera
            if (!nextCamera) {
                const nextIndex = (currentIndex + 1) % cameras.length;
                nextCamera = cameras[nextIndex];
            }

            // Stop current scanner and start with new camera
            if (html5QrCode && nextCamera) {
                html5QrCode.stop().then(() => {
                    currentCameraId = nextCamera.id;
                    console.log('Switching to camera:', nextCamera);
                    
                    // Restart with new camera
                    setTimeout(() => {
                        startCameraScan();
                    }, 500);
                }).catch((err) => {
                    console.error('Failed to stop for camera switch:', err);
                    updateScannerStatus('❌ Gagal mengganti kamera.', 'error');
                });
            }
        }

        // Handle successful scan with multi-scan support
        function onScanSuccess(decodedText) {
            console.log('=== NEW SCAN DETECTED ===');
            console.log('Scan successful:', decodedText);
            console.log('Previous lastScanResult:', lastScanResult);
            console.log('Current allScannedItems length:', allScannedItems.length);
            console.log('Current JO tracking:', Array.from(lastScannedJOs.entries()));
            
            // Force clear previous data
            lastScanResult = decodedText;
            
            // Parse QR data
            const parsedData = parseQRData(decodedText);
            console.log('Parsed data:', parsedData);
            
            // Add to all scanned items array
            const scanItem = {
                ...parsedData,
                scanTime: new Date().toLocaleTimeString(),
                scanIndex: allScannedItems.length + 1
            };
            allScannedItems.push(scanItem);
            console.log('Added to scanned items:', scanItem);
            console.log('Total scanned items after add:', allScannedItems.length);
            console.log('Full allScannedItems array:', JSON.stringify(allScannedItems, null, 2));
            
            // Validate JO Number and Product Code (ALLOW ALL SCANS)
            const validation = validateJOAndProductCode(parsedData);
            console.log('Validation result:', validation);
            
            // Stop scanner
            stopCameraScan();
            
            // Display ALL scanned items
            console.log('🔄 DISPLAYING ALL SCANNED ITEMS...');
            displayAllScannedItems(validation);
            
            // Always add to JO tracking (update if exists) - AFTER display
            addJOScan(parsedData.joNumber, parsedData.productCode);
            console.log('JO tracking after update:', Array.from(lastScannedJOs.entries()));
            
            // Update status based on validation
            if (validation.warning === 'DIFFERENT_PRODUCT_SAME_JO') {
                updateScannerStatus('✅ Scan berhasil! Product berbeda dengan JO sama. Data ditambahkan.', 'success');
            } else if (validation.warning === 'SAME_PRODUCT_SAME_JO') {
                updateScannerStatus('✅ Scan berhasil! Duplicate scan. Data ditambahkan.', 'success');
            } else {
                updateScannerStatus('✅ Scan berhasil! Data ditambahkan ke list.', 'success');
            }
            
            // Don't auto-send - let user manually send when ready
            console.log('📤 Ready to send. User will click "Send to Dashboard" button when ready.');
        }

        // Process manual input
        function processManualInput() {
            const manualValue = document.getElementById('manualInput').value.trim();
            if (manualValue) {
                onScanSuccess(manualValue);
                document.getElementById('manualInput').value = '';
            } else {
                updateScannerStatus('⚠️ Masukkan QR/Barcode terlebih dahulu', 'warning');
            }
        }

        // Clear manual input
        function clearManualInput() {
            document.getElementById('manualInput').value = '';
        }

        // Copy result to clipboard (multi-scan support)
        function copyResult() {
            console.log('=== COPY RESULT CALLED ===');
            console.log('All scanned items:', allScannedItems);
            console.log('Total items available:', allScannedItems.length);
            
            if (allScannedItems.length > 0) {
                let textToCopy = `📋 ALL SCANNED ITEMS (${allScannedItems.length} items):\n\n`;
                
                allScannedItems.forEach((item, index) => {
                    textToCopy += `--- Item #${item.scanIndex} (${item.scanTime}) ---\n`;
                    if (item.isValid) {
                        textToCopy += `JO Number: ${item.joNumber}\n` +
                                      `Product Code: ${item.productCode}\n` +
                                      `Product Name: ${item.productName}\n` +
                                      `QTY Order: ${item.qtyOrder}\n` +
                                      `Serial Number: ${item.serialNumber}\n` +
                                      `Raw: ${item.rawData}\n\n`;
                    } else {
                        textToCopy += `Raw QR Data: ${item.rawData}\n` +
                                      `Fields: ${item.fieldCount} (expected: 5)\n\n`;
                    }
                });
                
                navigator.clipboard.writeText(textToCopy).then(() => {
                    updateScannerStatus(`📋 ${allScannedItems.length} item(s) disalin ke clipboard!`, 'success');
                }).catch(err => {
                    updateScannerStatus('❌ Gagal menyalin hasil', 'error');
                });
            } else {
                updateScannerStatus('⚠️ Tidak ada hasil untuk disalin', 'warning');
            }
        }

        // Send result back to Dashboard via postMessage or Apps Script GET (multi-scan support)
        function sendToAppsScript() {
            console.log('=== sendToAppsScript called ===');
            console.log('All scanned items:', allScannedItems);
            console.log('Total items to send:', allScannedItems.length);
            
            if (allScannedItems.length === 0) {
                updateScannerStatus('⚠️ Tidak ada data untuk dikirim', 'warning');
                return;
            }
            
            const processId = getUrlParameter('processId') || 'ext_' + Date.now();
            const mode = getUrlParameter('mode') || 'redirect';
            console.log('Process ID:', processId);
            console.log('Mode:', mode);
            
            // Get returnUrl from URL parameters
            const returnUrl = getUrlParameter('returnUrl') || getUrlParameter('return') || 'https://script.google.com/macros/s/AKfycbwHLp6CFcNNSybJle982xGpCV5oXw6nvmd3R8W7Q1o/exec';
            console.log('Return URL:', returnUrl);
            console.log('Return URL type:', typeof returnUrl);
            console.log('Return URL length:', returnUrl ? returnUrl.length : 'null');
            
            // Prepare data to send - ALL SCANNED ITEMS
            const dataToSend = {
                type: 'QR_SCAN_ALL_ITEMS',
                allScannedItems: allScannedItems, // Send all items array
                totalItems: allScannedItems.length,
                lastScanResult: lastScanResult,
                processId: processId,
                timestamp: new Date().toISOString(),
                source: 'external_scanner'
            };
            
            // Try postMessage first (if opener is available)
            try {
                console.log('Checking window.opener:', window.opener);
                console.log('window.opener.closed:', window.opener ? window.opener.closed : 'N/A');
                
                if (window.opener && !window.opener.closed) {
                    console.log('📤 SENDING POSTMESSAGE WITH ALL ITEMS:', dataToSend);
                    window.opener.postMessage(dataToSend, '*');
                    
                    console.log('✅ Sent all items via postMessage');
                    updateScannerStatus(`✅ ${allScannedItems.length} item(s) dikirim ke Dashboard via postMessage`, 'success');
                    
                    // Close after a short delay
                    setTimeout(() => {
                        window.close();
                    }, 1500);
                    return;
                } else {
                    console.log('❌ Window opener not available or closed, trying Apps Script GET...');
                }
            } catch (error) {
                console.error('❌ postMessage failed, trying Apps Script GET:', error);
            }
            
            // Fallback: Send to Apps Script via URL redirect (bypass CORS)
            updateScannerStatus('📤 Mengirim semua data ke Apps Script dan kembali ke Dashboard...', 'info');
            
            // Use URL redirect to bypass CORS
            const appsScriptUrl = 'https://script.google.com/macros/s/AKfycbwHLp6CFcNNSybJle982xGpCV5oXw6nvmd3R8W7Q1o/exec';
            
            // Build redirect URL with ALL scanned items data
            const params = new URLSearchParams({
                // Send all items as JSON string
                allScannedItems: JSON.stringify(allScannedItems),
                totalItems: allScannedItems.length,
                lastScanResult: lastScanResult,
                source: 'external_scanner',
                processId: processId,
                timestamp: new Date().toISOString(),
                returnUrl: returnUrl, // Pass returnUrl for redirect back
                redirectBack: 'true', // Enable redirect back to dashboard
                scanSuccess: 'true' // Indicate successful scan
            });
            
            const redirectUrl = appsScriptUrl + '?' + params.toString();
            console.log('Redirect URL:', redirectUrl);
            console.log('Data being sent:', JSON.stringify(allScannedItems, null, 2));
            
            // Show success message before redirect
            updateScannerStatus(`✅ ${allScannedItems.length} item(s) diproses. Mengalihkan kembali ke Dashboard...`, 'success');
            
            // IMMEDIATE redirect to Apps Script (no delay)
            window.location.href = redirectUrl;
        }

        // Reset scanner (multi-scan support)
        function resetScanner() {
            console.log('=== RESETTING SCANNER ===');
            
            // Clear results
            document.getElementById('resultContent').innerHTML = '';
            document.getElementById('resultSection').style.display = 'none';
            
            // Clear all tracking data
            clearAllScannedItems();
            clearJOScanTracking();
            
            // Clear last scan result
            lastScanResult = null;
            
            updateScannerStatus('🔄 Scanner direset. Semua data dibersihkan.', 'info');
            
            // Auto-start camera after reset
            setTimeout(() => {
                startCameraScan();
            }, 1000);
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function() {
            console.log('QR Scanner External Page Loaded');
            console.log('Current URL:', window.location.href);
            console.log('URL Parameters:', window.location.search);
            
            // Get URL parameters
            const returnUrl = getUrlParameter('returnUrl') || getUrlParameter('return');
            const title = getUrlParameter('title') || 'QR Scanner';
            const processId = getUrlParameter('processId') || 'process_' + Date.now();
            
            console.log('Return URL:', returnUrl);
            console.log('Title:', title);
            console.log('Process ID:', processId);
            
            // Update page title
            if (title) {
                document.title = title;
            }
            
            // Always show success message since we have parameters
            if (returnUrl) {
                updateScannerStatus('✅ Scanner siap. Hasil akan dikirim ke Dashboard.', 'success');
            } else {
                updateScannerStatus('⚠️ Scanner siap. Mode standalone (no return URL).', 'info');
            }
            
            // Auto-focus manual input
            document.getElementById('manualInput').focus();
            
            // Auto-start camera scanner
            setTimeout(() => {
                startCameraScan();
            }, 1000);
        });
    </script>
</body>
</html>
